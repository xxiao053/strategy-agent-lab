[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt", "DATA_NOTICE.md", "DATA_NOTICE.zh-CN.md"]

[project]
name = "strategy-agent-lab"
version = "0.1.0"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "pydantic>=2.9,<3", "python-dotenv>=1,<2", "matplotlib>=3.9,<4", "exchange-calendars>=4.13,<5", "tzdata>=2025", "pypdf==7.0.1", "pillow==13.0.0"]

[project.optional-dependencies]
docker = ["openai-agents[docker]==0.24.0", "openai==3.50.0", "docker==7.2.0", "pydantic==2.14.3"]
test = ["pytest>=8,<10", "httpx2>=0.28", "jsonschema>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["market_data: integration tests requiring the private frozen market snapshots"]
