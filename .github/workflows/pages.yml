{
  "name": "Review or publish static showcase",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "publish": {
          "description": "Publish the reviewed showcase (requires completed security, license and data-rights checks)",
          "required": true,
          "type": "boolean",
          "default": false
        }
      }
    }
  },
  "permissions": {"contents": "read"},
  "concurrency": {"group": "pages", "cancel-in-progress": false},
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "env": {"VITE_SHOWCASE_REPOSITORY": "https://github.com/${{ github.repository }}"},
      "steps": [
        {"uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803", "with": {"persist-credentials": false}},
        {"uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38", "with": {"node-version": "22"}},
        {"name": "Install pinned package manager", "run": "npm install --global pnpm@11.25.0"},
        {"name": "Test and build static showcase", "run": "pnpm --dir web install --frozen-lockfile\npnpm --dir web test\npnpm --dir web build:showcase"},
        {"uses": "actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b", "with": {"path": "web/dist-showcase"}}
      ]
    },
    "deploy": {
      "if": "${{ inputs.publish }}",
      "needs": "build",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 10,
      "permissions": {"pages": "write", "id-token": "write"},
      "environment": {"name": "github-pages", "url": "${{ steps.deployment.outputs.page_url }}"},
      "steps": [
        {"name": "Publish approved artifact", "id": "deployment", "uses": "actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e"}
      ]
    }
  }
}
