{
  "name": "CI",
  "on": {"push": {}, "pull_request": {}, "workflow_dispatch": {}},
  "permissions": {"contents": "read"},
  "concurrency": {"group": "ci-${{ github.event.pull_request.number || github.ref }}", "cancel-in-progress": true},
  "jobs": {
    "backend": {
      "name": "Backend offline tests",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "steps": [
        {"uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803", "with": {"persist-credentials": false}},
        {"uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0", "with": {"python-version": "3.13", "cache": "pip", "cache-dependency-path": "requirements-runtime.lock"}},
        {"name": "Install locked runtime and test runner", "run": "python -m pip install --requirement requirements-runtime.lock\npython -m pip install --no-deps --editable .\npython -m pip install pytest==8.3.4\npython -m pip check"},
        {"name": "Run self-contained offline tests", "run": "python -m pytest -q --without-market-data"}
      ]
    },
    "frontend": {
      "name": "Frontend tests and builds",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "env": {"VITE_SHOWCASE_REPOSITORY": "https://github.com/${{ github.repository }}"},
      "steps": [
        {"uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803", "with": {"persist-credentials": false}},
        {"uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38", "with": {"node-version": "22"}},
        {"name": "Install pinned package manager and dependencies", "run": "npm install --global pnpm@11.25.0\npnpm --dir web install --frozen-lockfile"},
        {"name": "Run frontend tests", "run": "pnpm --dir web test"},
        {"name": "Build local application and static showcase", "run": "pnpm --dir web build\npnpm --dir web build:showcase"}
      ]
    }
  }
}
